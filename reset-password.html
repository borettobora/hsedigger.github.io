<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SafetyOnSite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1a1a1a; border: 1px solid #FFD600; border-radius: 16px; padding: 36px 28px; max-width: 380px; width: 100%; }
  .logo { color: #FFD600; font-size: 24px; font-weight: 700; letter-spacing: .04em; margin-bottom: 6px; }
  .sub { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 28px; }
  label { display: block; color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
  input { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; margin-bottom: 16px; }
  input:focus { border-color: #FFD600; }
  button { width: 100%; background: #FFD600; color: #000; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
  .msg.success { background: rgba(46,204,113,0.1); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
  .msg.error { background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid rgba(255,68,68,0.3); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">S·O·S SafetyOnSite</div>
  <div class="sub">Set your new password below</div>
  <label>New Password</label>
  <input type="password" id="pass1" placeholder="Min 6 characters">
  <label>Confirm Password</label>
  <input type="password" id="pass2" placeholder="Repeat new password">
  <button id="btn" onclick="resetPassword()">Set New Password</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  const sb = supabase.createClient(
    'https://nncrqfafpgkhyfrvwzkj.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uY3JxZmFmcGdraHlmcnd6a2oiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc0MzYyMDU1MSwiZXhwIjoyMDU5MTk2NTUxfQ.7sCPKrfJ36VRZ7c7DPtdCsBKUjsVCMkUUn0cZ4XoRZk'
  );

  async function resetPassword() {
    var p1 = document.getElementById('pass1').value;
    var p2 = document.getElementById('pass2').value;
    var btn = document.getElementById('btn');
    var msg = document.getElementById('msg');

    msg.style.display = 'none';

    if (!p1 || p1.length < 6) {
      showMsg('Password must be at least 6 characters.', 'error'); return;
    }
    if (p1 !== p2) {
      showMsg('Passwords do not match.', 'error'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating...';

    var { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      showMsg('Error: ' + error.message, 'error');
    } else {
      showMsg('✅ Password updated! You can now sign in to SafetyOnSite.', 'success');
      btn.textContent = 'Done';
    }
    btn.disabled = false;
  }

  function showMsg(text, type) {
    var msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
    msg.style.display = 'block';
  }
</script>
</body>
</html>
